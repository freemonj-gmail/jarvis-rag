[project]
name = "my-python-examples"
version = "1.18.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.107.0",
    "easyocr>=1.7.2",
    "frontend>=0.0.3",
    "httpx>=0.27",
    "huggingface-hub>=1.9.0",
    "kokoro>=0.9.4",
    "llama-index>=0.14.20",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-ollama>=0.10.1",
    "llama-index-readers-file>=0.6.0",
    "llama-index-retrievers-bm25>=0.5.0",
    "num2words>=0.5.13",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.3.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "pygame>=2.6.1",
    "pymilvus>=3.0.0",
    "pypandoc>=1.17",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.2",
    "soundfile>=0.14.0",
    "tabula-py>=2.10.0",
    "transformers>=4.44.0",
    "unstructured>=0.22.16",
    "ocrmac>=1.0.0 ; sys_platform == 'darwin'",
]

# NOTE: The Surya layout/recognition backend for the confidence-routed page
# pipeline (JARVIS_ENABLE_SURYA) is intentionally NOT declared here. Current
# ``surya-ocr`` releases pin ``pillow<11`` which conflicts with this project's
# ``pillow>=12.2.0``, so it cannot be co-resolved in the main lockfile. The
# pipeline runs without it (native PyMuPDF text + pytesseract/easyocr fallback);
# to try Surya, install a compatible build into an isolated environment. Once a
# ``pillow>=12`` compatible ``surya-ocr`` ships, add it as an ``ocr`` extra.
